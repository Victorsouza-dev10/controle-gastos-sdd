<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Controle de Gastos Pessoais</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            font-size: 2rem;
            font-weight: 600;
        }
        .subtitle {
            color: #666;
            margin-top: 5px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #eee;
        }
        .card h3 {
            font-size: 0.875rem;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .card .value {
            font-size: 2rem;
            font-weight: 700;
        }
        .card.entradas .value { color: #10b981; }
        .card.saidas .value { color: #ef4444; }
        .card.saldo .value { color: #3b82f6; }
        .card.saldo.negativo .value { color: #ef4444; }
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #eee;
        }
        .chart-container h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: #888;
        }
        .error {
            color: #ef4444;
            text-align: center;
            padding: 20px;
        }
        @media (max-width: 768px) {
            .chart-wrapper {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard Financeiro</h1>
            <p class="subtitle">Visão geral dos seus gastos e saldo</p>
        </header>

        <div class="cards">
            <div class="card entradas">
                <h3>Entradas</h3>
                <div class="value" id="entradas">R$ 0,00</div>
            </div>
            <div class="card saidas">
                <h3>Saídas</h3>
                <div class="value" id="saidas">R$ 0,00</div>
            </div>
            <div class="card saldo" id="saldo-card">
                <h3>Saldo</h3>
                <div class="value" id="saldo">R$ 0,00</div>
            </div>
        </div>

        <div class="chart-container">
            <h2>Gastos por Categoria (Mês Atual)</h2>
            <div class="chart-wrapper">
                <canvas id="gastosChart"></canvas>
            </div>
            <div id="chart-loading" class="loading">Carregando gráfico...</div>
            <div id="chart-error" class="error" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Formata valor para moeda brasileira
        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value);
        }

        // Atualiza cards de saldo
        function updateSaldoCards(data) {
            document.getElementById('entradas').textContent = formatCurrency(parseFloat(data.entradas));
            document.getElementById('saidas').textContent = formatCurrency(parseFloat(data.saidas));
            const saldo = parseFloat(data.saldo);
            document.getElementById('saldo').textContent = formatCurrency(saldo);

            const saldoCard = document.getElementById('saldo-card');
            if (saldo < 0) {
                saldoCard.classList.add('negativo');
            } else {
                saldoCard.classList.remove('negativo');
            }
        }

        // Renderiza gráfico de gastos por categoria
        function renderChart(categorias) {
            const ctx = document.getElementById('gastosChart').getContext('2d');
            const loading = document.getElementById('chart-loading');
            const errorDiv = document.getElementById('chart-error');

            loading.style.display = 'none';
            errorDiv.style.display = 'none';

            if (!categorias || categorias.length === 0) {
                errorDiv.textContent = 'Nenhum gasto cadastrado para o mês atual.';
                errorDiv.style.display = 'block';
                return;
            }

            const labels = categorias.map(c => c.categoria);
            const data = categorias.map(c => parseFloat(c.total));

            // Cores para o gráfico
            const colors = [
                'rgba(239, 68, 68, 0.8)',   // vermelho
                'rgba(249, 115, 22, 0.8)',  // laranja
                'rgba(234, 179, 8, 0.8)',   // amarelo
                'rgba(34, 197, 94, 0.8)',   // verde
                'rgba(59, 130, 246, 0.8)',  // azul
                'rgba(168, 85, 247, 0.8)',  // roxo
                'rgba(236, 72, 153, 0.8)',  // rosa
                'rgba(20, 184, 166, 0.8)',  // teal
            ];
            const borderColors = colors.map(c => c.replace('0.8', '1'));

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Gastos por Categoria',
                        data: data,
                        backgroundColor: colors.slice(0, labels.length),
                        borderColor: borderColors.slice(0, labels.length),
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                padding: 20,
                                usePointStyle: true,
                                font: {
                                    size: 13
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.raw;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return `${context.label}: ${formatCurrency(value)} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // Busca saldo total
        async function fetchSaldo() {
            try {
                const response = await fetch('/saldo');
                if (!response.ok) throw new Error('Erro ao buscar saldo');
                const data = await response.json();
                updateSaldoCards(data);
            } catch (error) {
                console.error('Erro ao buscar saldo:', error);
            }
        }

        // Busca resumo do mês atual
        async function fetchResumo() {
            const hoje = new Date();
            const mesAtual = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0');

            try {
                const response = await fetch(`/resumo?mes=${mesAtual}`);
                if (!response.ok) throw new Error('Erro ao buscar resumo');
                const data = await response.json();
                renderChart(data.por_categoria);
            } catch (error) {
                console.error('Erro ao buscar resumo:', error);
                const errorDiv = document.getElementById('chart-error');
                errorDiv.textContent = 'Erro ao carregar gráfico: ' + error.message;
                errorDiv.style.display = 'block';
                document.getElementById('chart-loading').style.display = 'none';
            }
        }

        // Inicializa o dashboard
        async function init() {
            await Promise.all([
                fetchSaldo(),
                fetchResumo()
            ]);
        }

        init();
    </script>
</body>
</html>
