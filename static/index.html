<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Controle de Gastos Pessoais</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Dashboard Financeiro</h1>
            <p class="subtitle">Visão geral dos seus gastos e saldo</p>
        </header>

        <div class="cards">
            <div class="card entradas">
                <div class="card-header">
                    <h3>Entradas</h3>
                    <button type="button" class="btn btn-danger btn-sm" id="btn-zerar-entradas" title="Zerar todas as entradas">🗑️</button>
                </div>
                <div class="value" id="entradas">R$ 0,00</div>
            </div>
            <div class="card saidas">
                <div class="card-header">
                    <h3>Saídas</h3>
                    <button type="button" class="btn btn-danger btn-sm" id="btn-zerar-saidas" title="Zerar todas as saídas">🗑️</button>
                </div>
                <div class="value" id="saidas">R$ 0,00</div>
            </div>
            <div class="card saldo" id="saldo-card">
                <div class="card-header">
                    <h3>Saldo</h3>
                    <button type="button" class="btn btn-danger btn-sm" id="btn-zerar-saldo" title="Zerar todo o histórico (todas as transações)">🗑️</button>
                </div>
                <div class="value" id="saldo">R$ 0,00</div>
            </div>
        </div>

        <div id="zerar-message" class="form-message" style="display: none;"></div>

        <div class="chart-container">
            <h2>Gastos por Categoria (Mês Atual)</h2>
            <div class="chart-wrapper">
                <canvas id="gastosChart"></canvas>
            </div>
            <div id="chart-loading" class="loading">Carregando gráfico...</div>
            <div id="chart-error" class="error" style="display: none;"></div>
        </div>

        <div class="form-container" id="nova-transacao-form">
            <h2>Nova Transação</h2>
            <form id="transacao-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="descricao">Descrição *</label>
                        <input type="text" id="descricao" name="descricao" required maxlength="200" placeholder="Ex: Supermercado, Salário, etc.">
                    </div>
                    <div class="form-group">
                        <label for="valor">Valor *</label>
                        <input type="number" id="valor" name="valor" required step="0.01" min="0.01" placeholder="0,00">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="tipo">Tipo *</label>
                        <select id="tipo" name="tipo" required>
                            <option value="">Selecione...</option>
                            <option value="entrada">Entrada</option>
                            <option value="saida">Saída</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" name="categoria">
                            <option value="">Sem categoria</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="data">Data *</label>
                        <input type="date" id="data" name="data" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="btn-submit">Adicionar Transação</button>
                </div>
                <div id="form-message" class="form-message" style="display: none;"></div>
            </form>
        </div>
    </div>

    <script src="/static/app.js" defer></script>
</body>
</html>
